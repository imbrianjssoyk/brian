function polyDense(VT){const dense=[];

{let j=0;for(let k=0;k<N;k++){const d=TL*k/N;while(cl[j+1]<d)j++;const a=dense[j],b=dense[(j+1)%dense.length],f=(d-cl[j])/(cl[j+1]-cl[j]||1);raw.push(new THREE.Vector3(a.x+(b.x-a.x)*f,0,a.z+(b.z-a.z)*f))}}
